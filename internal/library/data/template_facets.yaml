  marketing-psychology: {goal: analysis, output: report, added: "2026-10-22"}
  marketing-loops: {goal: strategy, output: plan, added: "2026-10-22"}
  marketing-plan: {goal: strategy, output: plan, added: "2026-10-22"}
  content-strategy: {goal: content, output: plan, added: "2026-10-22"}
  offers: {goal: strategy, output: plan, added: "2026-10-22"}
  launch: {goal: strategy, output: plan, added: "2026-10-22"}
