# Business types and the advertising rules each one follows (Sprint 7 #32 and #34, owner
# decision 2026-11-14). This file is the single source of truth: the compliance filter
# (filter.go) blocks text that matches a type's blocks, and every chat, caption and script
# prompt gets the baseline guidance plus the type's own guidance (PromptRules). marketflow-api
# keeps a mirrored key list (internal/modules/tenant/business_types.go) that its parity test
# checks against this file.
#
# An empty or unknown type, and the legacy "codevertex" persona, get the "generic" rules.
# "flp" keeps its own strict filter in filter.go exactly as it was (disclaimers and
# substitutions); its entry here only lists it and words the same rules for the prompts.
#
# Blocks are RE2 patterns. A match drops the whole text, so each one is narrow: it targets a
# phrase that is wrong for that business whatever the facts are. Anything that depends on the
# facts (is the "was" price real, is the room really free) is guidance for the writer, not a block.
#
# allow_negated: true lets a refusal through (owner, 2026-11-14). The pattern marks its promotion
# phrase with (?P<promo>...) groups (the same name may appear in each alternative), and a match is
# not a violation when a negation (can't, cannot, don't, no, never, not, unable to, hatuwezi,
# hatutoi, hakuna, si, sio and similar) stands before that phrase in the same clause. RE2 has no
# lookbehind, so negation.go does the check; "don't miss" and "never been cheaper" still count as
# sales lines. The gap between the promotion phrase and the medicine is lazy ({0,40}?), so the
# phrase checked is the one nearest the medicine: in "Panadol is not on offer, but lotions are
# 20% off" it is "on offer", which is negated.
#
# exempt: a block whose pattern marks its medicine word with (?P<med>...) groups may name phrases
# that are not medicines although they start with a medicine word ("dawa ya meno" is toothpaste).
# A match whose medicine word starts one of them is not a violation.
#
# Sources (read 2026-11-14):
# - Consumer Protection Act No. 46 of 2012 (Cap. 501, Kenya Law revision as at 31 December 2022),
#   s. 12(1) and (2)(a), (k), (n): false, misleading or deceptive representations, including
#   benefits or approval a product does not have, a price advantage that does not exist and
#   exaggeration; s. 13(2)(h): undue pressure; s. 15: unfair practices are prohibited. Text read
#   from the Kenya Law PDF (FRBR /akn/ke/act/2012/46/eng@2022-12-31) mirrored at
#   https://globalfoodlaws.georgetown.edu/wp-content/uploads/2026/05/Kenya_2022_Consumer-Protection-Act_EN.pdf
# - Competition Act No. 12 of 2010 (Kenya), s. 55: false or misleading representations,
#   including about a price advantage or a previous price (not re-read on 2026-11-14).
# - Pharmacy rules: see the pharmacy entry below for the exact documents, clauses and URLs (the
#   Pharmacy and Poisons Act Cap 244 ss. 36 to 40 and Schedule, the Pharmacy and Poisons
#   (Amendment) Rules 2022 (L.N. 98 of 2022) rules 22 to 44, and the PPB Guideline for
#   Advertisement and Promotion of Health Products and Technologies, HPT/PDS/GUD/046 Rev. 3,
#   July 2025), all read in their own text on 2026-11-14.
# - KEBS cosmetics standards (KS EAS 377) and the KEBS bans on mercury and hydroquinone in skin
#   products: no skin lightening or bleaching promotion.
# - Tourism Act 2011 and the Tourism Regulatory Authority classification: star ratings only when
#   classified. VAT Act 2013 (16 percent) and the Tourism Fund catering levy (2 percent).
# - Data Protection Act 2019 (Kenya), s. 37: commercial use of personal data needs consent,
#   which covers testimonials and before and after photos of real people.
# - ASA CAP Code (UK) principles used as a model: substantiation, no misleading prices or
#   urgency, testimonials must be genuine.

baseline:
  guidance:
    - Use only the facts, prices and offers the business gave you. Never invent a price, discount, stock level, award, certification, licence or review.
    - Never promise a result the business cannot deliver to every customer. Where results differ from person to person, say so.
    - A discount or "was" price must be a real earlier price.
    - Reviews, testimonials and before and after pictures must come from real customers who agreed to be shown.
    - Give prices in KES with what is included, and name any extra cost such as delivery, VAT or a booking fee.
  blocks:
    - pattern: '(?i)\bcure[sd]?\b|\bcuring\b'
      reason: claims that something cures a condition
    - pattern: '(?i)\bmiracle\b|\bmagic\b|\bwonder\s+drug\b'
      reason: miracle or magic claims
    - pattern: '(?i)\bguaranteed?\s+income\b'
      reason: guaranteed income
    - pattern: '(?i)\bget\s+rich\b'
      reason: get rich promises
    - pattern: '(?i)\beasy\s+money\b'
      reason: easy money promises
    - pattern: '(?i)\bmake\s+money\s+fast\b'
      reason: fast money promises
    - pattern: '(?i)\bguaranteed?\s+(returns?|profits?)\b'
      reason: guaranteed returns or profits
    - pattern: '(?i)\brisk[\s-]free\s+(investment|returns?|profits?)\b'
      reason: risk-free investment claims
    - pattern: '(?i)\bdouble\s+your\s+(money|investment)\b'
      reason: doubling money promises

# The owner's marketing laws (2026-11-17), in their honest form only. PromptRules sends the
# guidance with every chat answer, caption, script, post and sales reply, for every business type
# (the FLP personas get it through MarketingLaws), so it is kept short: one law per line, the
# instruction first and the line it must not cross second. Wording checked with the
# marketing-psychology kit (dark-pattern-check rows DP-01 deadlines, DP-05 "was" prices, DP-13
# expiry; persuasion-audit ledger: scarcity works only when the limit is real and its reason is
# visible, repetition helps in moderation and with varied wording, loss framing is design
# dependent, so it is a choice and never a rule). The guidance must never contain a date, a
# weekday or a stock figure itself: the checks below read the whole prompt as facts in chat.
#
# checks are the deterministic part. A draft that matches pattern needs a fact behind it: the
# facts (brand context, business facts, knowledge base, the owner's own request, tool results)
# must match supported_by, or, with same_phrase, contain the matched words themselves. Every
# check is advice only (owner, 2026-11-17): a match is a finding for the owner (severity review),
# never a block, a rewrite, a fallback, an emptied field or a lead hand-off. The writer still gets
# the guidance above in its prompt. Invented prices and percentages, commitments, banned claims
# and the compliance blocks stay blocking; they are checked elsewhere, not here.
marketing_laws:
  guidance:
    - 'Attention: open with the hook in the first line or first 2 seconds (the buyer''s specific problem, a surprising true number from the facts, or the result). The rest must pay off the hook.'
    - 'Relevance: write to one audience and their real situation (place, work, season, M-Pesa and WhatsApp habits). Never pretend to know the reader personally.'
    - 'Emotion: lead with how the outcome feels, then back it with facts (price, proof, terms). Never use fear about illness, debt, grief or children.'
    - 'Friction: give one next step only (one WhatsApp message, one M-Pesa payment or one short form) and say what they get. Never hide a cost to make it look easier.'
    - 'Urgency and scarcity: only a deadline or limit the facts give (an event, an offer end, real stock), the same for everyone, with its reason. Never invent "today only", "last chance", countdowns or "only N left".'
    - 'Identity: show who the customer becomes (the shop owner who closes the day early). Never shame people who do not buy.'
    - 'Contrast: compare with a true costlier or slower alternative (doing it by hand, a pricier option). No "was" price or percent off unless the facts give the real earlier price; never name and run down a competitor; no claim to be the top or cheapest unless the facts prove it.'
    - 'Repetition: keep one core message and repeat it across the posts, ads and messages of a campaign, in fresh words each time. Repeat only what is true.'
    - 'Association: link the brand only to real customers, places, partners and credentials in the facts. No invented endorsements, logos or reviews.'
    - 'Perceived value: sell the outcome (time saved, sales gained, worry removed) with numbers the facts prove, rather than a list of features.'
    - 'Loss aversion: where it fits, show the true cost of waiting (a penalty, lost sales, hours spent), in proportion. Never a loss the facts do not show.'
  checks:
    - law: urgency
      reason: urgency the facts do not back with a real deadline
      fix: Remove the deadline words, or use the real end date from the facts.
      pattern: '(?i)\btoday only\b|\bone day only\b|\blast chance\b|\bends? (today|tonight|soon|at midnight)\b|\boffer ends\b|\blimited[- ]time\b|\bhurry (up|now|while|before)\b|\bact (now|fast)\b|\bdon[''’]?t miss (out|this)\b|\bbefore it[''’]?s too late\b|\bcountdown\b|\bonly \d+ (days?|hours?) (left|to go)\b|\bleo tu\b|\bmwisho (ni )?leo\b|\bharakisha\b|\bofa inaisha\b|\bsiku ya mwisho\b'
      # A deadline word followed directly by a real date or weekday ("Offer ends: 30 November",
      # "starts Saturday"); "open until 9pm, Monday to Friday" is opening hours, not a deadline.
      supported_by: '(?i)\b(ends?|ending|until|till|by|before|deadline|closes?|closing|expires?|valid (till|until|to)|last day|event|launch(es)?|starts?|hadi|mwisho|tarehe)\b[\s:,-]*(on\s+|this\s+|next\s+|ya\s+)?(\d{1,2}(st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*|(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2}\b|\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}(/\d{2,4})?\b|(mon|tues|wednes|thurs|fri|satur|sun)day\b|jumamosi\b|jumapili\b|ijumaa\b)'
    - law: scarcity
      reason: scarcity the facts do not back with a real stock or capacity figure
      fix: Remove the stock claim, or state the real figure from the facts.
      pattern: '(?i)\bonly \d+ (left|remaining|available|in stock|spots?|slots?|seats?|places?|pieces?|units?)\b|\b\d+ (left|remaining) in stock\b|\blimited (stock|spots?|slots?|seats?|places?|units?|edition|quantities)\b|\bselling (out )?fast\b|\balmost (gone|sold out)\b|\b(few|last few) (left|remaining|pieces|units)\b|\bwhile (stocks?|supplies) lasts?\b|\bstock (inaisha|ni chache)\b|\bzimebaki\b|\bchache tu\b'
      supported_by: '(?i)\b\d+\s*(left|in stock|remaining|available|seats? left|slots? left)\b|\b(stock|in stock|capacity|seats|slots|places|tickets)\s*(left|available|remaining)?\s*[:=]\s*\d+|\blimited edition\b|\bzimebaki\s+\d+'
    - law: contrast
      reason: a "was" price or discount the facts do not give
      fix: Remove the earlier price or discount, or use the real one from the facts.
      pattern: '(?i)\bwas\s+(kes|ksh|sh\.?|\$)?\s?\d|\b(down|reduced) from\b|\bslashed\b|\b(regular|original|usual|normal|old) price\b|\bsave (kes|ksh|sh\.?)\s?\d|\b\d+\s?% off\b|\bhalf price\b|\bbei ya zamani\b|\bpunguzo la\b|\bilikuwa (kes|ksh|sh)?\s?\d'
      supported_by: '(?i)\b(was|previous(ly)?|regular|original|usual|normal|before|old|ilikuwa)\s+(price\s+)?(was\s+)?[:=]?\s*(kes|ksh|sh\.?|\$)?\s?\d|\b\d[\d,.]*\s?%?\s?off\b|\b(discount|punguzo|sale price|offer price)\b[^.\n]{0,40}\d|\bhalf price\b'
    - law: superlative
      same_phrase: true
      reason: a "best" or "No. 1" claim the facts do not prove
      fix: Say what is specifically good, or cite the award or ranking from the facts.
      pattern: '(?i)\b(no\.?\s?1|number one|the best|best[- ]sell(ing|er)|the cheapest|lowest prices?|cheapest in|the leading|leading provider|most trusted|most popular|unbeatable|bora zaidi|nambari moja|bei nafuu zaidi)\b|(^|\s)#1\b'
      supported_by: '(?i)\b(award(ed)?|winner|ranked|rated|voted|certified best|tuzo)\b'

types:
  - key: generic
    label: Other business
    description: Any business not listed here. It follows the shared honesty rules every business gets.
    guidance:
      - "Sell by: lead with the customer's question, give the price in KES with what it includes, one next step on WhatsApp or M-Pesa, and real proof or none."

  - key: flp
    label: Forever Living (FBO)
    description: Forever Business Owners selling Forever Living products. The strictest rules, with the health and income disclaimers Forever requires.
    strict: flp
    guidance:
      - Never say a product cures, treats, heals or prevents any disease. Use "supports", "promotes" or "helps maintain".
      - Never promise income. Results vary, and income talk carries the Forever income disclaimer.
      - Never call a product FDA approved, a miracle or a wonder drug.
      - Suggest a healthcare professional for any medical question.
      - "Sell by: show the product and how to order it, answer fast, and send buyers to the distributor's own Forever shop link."

  - key: restaurant
    label: Restaurant or cafe
    description: Restaurants, cafes, bakeries, bars and food delivery. Honest menus, prices and allergens.
    aliases: [cafe, food, eatery, bakery]
    guidance:
      - Never say a dish or drink treats, prevents or heals a condition, burns fat or detoxes the body.
      - Be honest about allergens. Call a dish nut free, gluten free, dairy free, halal or vegan only when the business confirmed it, and tell guests with allergies to ask the staff.
      - Menu items, portions, prices and opening hours must match what the business gave you.
      - Say "fresh", "homemade" or "organic" only when the business said so.
      - "Sell by: real dishes from the kitchen, price per plate, delivery time and area, open now; urgency only from a special the kitchen named or a dated event; next step: WhatsApp your order or order online with M-Pesa."
    blocks:
      - pattern: '(?i)\ballerg(en|y)[\s-]free\b|\bsafe\s+for\s+(all|any|every)\s+allerg(y|ies)\b|\b100\s*%\s*(nut|peanut|gluten|dairy|lactose)[\s-]free\b'
        reason: absolute allergen safety claims
      - pattern: '(?i)\b(burns?|melts?)\s+(belly\s+)?fat\b|\b(detox(es|ifies)?|cleanses?)\s+your\s+(body|liver|kidneys|blood|system)\b|\bboosts?\s+(your\s+)?immun(e\s+system|ity)\b|\b(lowers?|reduces?)\s+(your\s+)?(blood\s+(sugar|pressure)|cholesterol)\b'
        reason: unverifiable health claims about food

  - key: retail
    label: Retail shop
    description: Shops, supermarkets, boutiques and hardware stores selling in person. Real prices, real stock and real discounts.
    aliases: [shop, store, supermarket, boutique]
    guidance:
      - Prices and stock must be the business's real ones. Never invent "only a few left" or "selling fast".
      - A "was" price must be a price the item really sold at before. Otherwise show only the current price.
      - Say "original" or "genuine" only when the business confirmed it, and never claim a KEBS mark the product does not carry.
      - State delivery cost and area, and the return and refund terms, or say where to find them.
      - "Sell by: price, genuine goods and pickup or delivery; trust from the till or paybill name and the shop location; urgency only from a dated offer or a restock that really arrived; next step: WhatsApp to check stock."
    blocks:
      - pattern: '(?i)\b(cheapest|lowest\s+prices?)\s+in\s+(kenya|nairobi|mombasa|kisumu|town|the\s+country|africa)\b|\b(lowest|best)\s+prices?\s+guaranteed\b|\bguaranteed\s+(lowest|best)\s+prices?\b'
        reason: unprovable lowest price claims
      - pattern: '(?i)\bno\s+refunds?\s*(,|/|or|and)?\s*(no\s+)?returns?\b|\bno\s+returns?\s*(,|/|or|and)?\s*(no\s+)?refunds?\b'
        reason: blanket no refund statements (faulty goods keep their legal remedies)

  - key: ecommerce
    label: Online shop (e-commerce)
    description: Businesses that sell online with delivery. Real prices and stock, clear delivery, payment and return terms.
    aliases: [e-commerce, online-shop, online_shop]
    guidance:
      - Prices and stock must be the business's real ones. Never invent "only a few left", visitor counts or countdown timers.
      - A "was" price must be a price the item really sold at before. Otherwise show only the current price.
      - State the delivery cost, areas and time, the payment methods, and the return and refund terms, or link to them.
      - Say "original" or "genuine" only when the business confirmed it.
      - Marketing messages go only to people who agreed to receive them, with a way to stop.
      - "Sell by: prove the seller is real (business name, a phone that answers, real photos, delivery terms); one product, one link, M-Pesa at checkout; urgency only from a dated sale or a real shipping cut-off."
    blocks:
      - pattern: '(?i)\b(cheapest|lowest\s+prices?)\s+in\s+(kenya|nairobi|mombasa|kisumu|town|the\s+country|africa)\b|\b(lowest|best)\s+prices?\s+guaranteed\b|\bguaranteed\s+(lowest|best)\s+prices?\b'
        reason: unprovable lowest price claims
      - pattern: '(?i)\bno\s+refunds?\s*(,|/|or|and)?\s*(no\s+)?returns?\b|\bno\s+returns?\s*(,|/|or|and)?\s*(no\s+)?refunds?\b'
        reason: blanket no refund statements (faulty goods keep their legal remedies)

  - key: services
    label: Professional services
    description: Consultants, agencies, trainers, contractors, cleaners and other service providers. No guaranteed outcomes, licences named truthfully.
    aliases: [service, professional-services]
    guidance:
      - Never guarantee an outcome the business does not control, such as a visa, a loan, a job, an exam pass or a court case.
      - Name a licence, registration or membership (for example NCA, LSK, EBK or ICPAK) only when the business gave it, and name it exactly.
      - Say what the price includes and what costs extra. Give timelines as estimates unless the business commits to them.
      - "Sell by: past work shown with the client's permission, the price range and response time; limited slots only when the calendar is really full; next step: book a call or WhatsApp for a quote."
    blocks:
      - pattern: '(?i)\bguaranteed?\s+(visa|approval|job|employment|placement|admission|pass|win|loan|results?|success)\b|\b100\s*%\s+(success|pass|approval)(\s+rate)?\b|\bguaranteed\s+to\s+(win|pass|get)\b'
        reason: guaranteed outcomes

  - key: saas
    label: Software or app (SaaS)
    description: Software, apps and online tools sold by subscription. No fake uptime or security claims, clear trial and renewal terms.
    aliases: [software, app, tech]
    guidance:
      - Quote uptime only as the published SLA figure. Never promise that the service never goes down.
      - Name a security certification (ISO 27001, SOC 2, PCI DSS) or Data Protection Commissioner registration only when the business holds it. Never call the product unhackable or completely secure.
      - State the trial length, what happens when it ends, the renewal price and how to cancel.
      - Say "unlimited" only when there is no fair use limit.
      - "Sell by: works with M-Pesa, eTIMS and a phone; the monthly KES price; setup time and who helps when it breaks; real screens, not mockups; urgency only from a dated launch price or an accurately stated statutory deadline; next step: free trial or a WhatsApp demo."
    blocks:
      - pattern: '(?i)\b100\s*%\s+uptime\b|\bzero\s+downtime\b|\bnever\s+goes\s+down\b'
        reason: absolute uptime claims
      - pattern: '(?i)\bunhackable\b|\bhack[\s-]?proof\b|\b100\s*%\s+secure\b|\b(completely|totally|fully)\s+secure\b|\b(military|bank)[\s-]grade\s+(security|encryption)\b'
        reason: absolute security claims

  - key: salon
    label: Salon, barber or beauty
    description: Hair salons, barbers, spas, nail and beauty studios. No guaranteed results, real before and after pictures only.
    aliases: [beauty, barber, barbershop, spa]
    guidance:
      - Never guarantee a result, and never promise instant, overnight or permanent results.
      - Before and after pictures only from real clients who agreed in writing, shown without editing.
      - Never promote skin lightening or bleaching products or injections (KEBS bans mercury and hydroquinone in skin products).
      - Never make medical claims about skin, scalp or hair, such as regrowing hair or curing acne.
      - "Sell by: the stylist's real work, hygiene, price per service and waiting time; urgency from weekend or festive booking slots; next step: book on WhatsApp."
      - Name the products and brands used truthfully.
    blocks:
      - pattern: '(?i)\bguaranteed?\s+(results?|hair\s+growth|clear(er)?\s+skin|weight\s+loss)\b|\bresults\s+guaranteed\b|\b(instant|overnight)\s+results?\b|\bpermanent(ly)?\s+(hair\s+removal|results?)\b'
        reason: guaranteed or instant beauty results
      - pattern: '(?i)\b(skin\s+)?(lightening|bleaching|whitening)\s+(creams?|lotions?|soaps?|injections?|pills?|treatments?|products?|serums?)\b|\bglutathione\s+(injections?|drips?)\b'
        reason: skin lightening or bleaching promotion
      - pattern: '(?i)\b(regrows?|restores?)\s+(your\s+)?(lost\s+)?hair\b'
        reason: hair regrowth claims

  - key: pharmacy
    label: Pharmacy or chemist
    description: Pharmacies, chemists and health product shops. Pharmacy and Poisons Board advertising limits apply.
    aliases: [chemist, pharmaceutical]
    # Sources, all read in their own text on 2026-11-14:
    # - Pharmacy and Poisons Act, Cap 244, as at 11 December 2023 (Kenya Law,
    #   https://new.kenyalaw.org/akn/ke/act/1956/17/eng@2023-12-11, read through the web.archive.org
    #   capture of 5 March 2026 because Kenya Law refuses automated fetches): s. 2 ("advertisement"
    #   includes oral announcements and anything transmitted by light or sound), s. 36 (no drug may be
    #   advertised without the Board's written permission), s. 37 and the Schedule (no advert may imply
    #   a drug is effective for the listed diseases or for restoring or stimulating sexual function),
    #   s. 38 (abortion), s. 39 (extravagant claims), s. 40 (penalties).
    # - Pharmacy and Poisons (Amendment) Rules, 2022, L.N. 98 of 2022, Kenya Subsidiary Legislation
    #   2022 pp. 657 to 675 (https://faolex.fao.org/docs/pdf/ken212579.pdf): rules 22 (written
    #   approval, registered products only, approval number and holder details on print), 23 and 24
    #   (what is and is not an advert), 25 (prohibited adverts), 26 (general public: general sale
    #   only; pharmacy-only inside the pharmacy; prescription-only only at the point of sale;
    #   controlled drugs never), 29 (herbal), 30 (vitamins), 31 (weight management disclaimer),
    #   32 (pregnant and lactating women), 33 (children), 34 (required content for the public),
    #   38 (websites for the public: no named prescription-only medicine, no highlighted price
    #   offers, no free offers in competitions), 44 (offences).
    # - PPB Guideline for Advertisement and Promotion of Health Products and Technologies,
    #   HPT/PDS/GUD/046 Rev. No. 3, July 2025 (supersedes Rev. 2 of 13 July 2022),
    #   https://web.pharmacyboardkenya.org/download/guideline-for-advertisement-and-promotion-of-health-products-and-technologies/
    #   Sections 5.0, 6.0 (a) to (n), 7.0, 8.0, 9.0, 10.0, 12.0, 13.0 (c), 16.0, 17.0 and 18.0.
    guidance:
      # Rule 26(1)(a) to (d); guideline 7.0 (general public) (a) to (c) and 12.0 general (a).
      - Advertise to the public only general sale medicines and health products registered with the Pharmacy and Poisons Board. Pharmacy-only medicines may be promoted only inside the pharmacy, never in posts, ads or broadcasts. Controlled drugs are never advertised to the public.
      # Rule 26(1)(c), rule 38(1)(c) and (g); guideline 7.0 (a) and (d), 12.0 (licensed online pharmacies) (a) to (d), 5.0 (not an advert) (c) and (d), 13.0 (c).
      - Never advertise prescription-only medicines (antibiotics, weight loss injections, strong painkillers, sleeping pills, erection pills and similar) to the public in ads, posts, captions or broadcasts, even with only a price. You may say the pharmacy fills prescriptions. When a customer asks in chat whether a prescription-only medicine is in stock or what it costs, answer factually, say it needs a valid prescription, and do not push it.
      # Act s. 37 and Schedule, s. 38, s. 39; rule 22(4); guideline 18.0, 7.0 (herbal) (n), 7.0 (medical devices) (f) and (g).
      - Never say a medicine, supplement or device cures, treats, prevents or relieves a serious disease such as cancer, diabetes, tuberculosis, epilepsy, HIV, high blood pressure or heart disease, or that it restores or boosts sexual performance. Never mention anything for ending a pregnancy.
      # Guideline 16.0 (claims) (c), (d), (f); 10.0 (e); 7.0 (herbal) (k), (l), (m), (o), (p); 16.0 (comparisons) (a); CPA s. 12(2)(a) and (n).
      - Never call a product safe, harmless, free of side effects or safe because it is natural, and never say it is guaranteed to work, works for everyone, is the best or number one, or is better than or as good as another product. Use only the claims on the approved label. Never call a herbal product clinically proven.
      # Guideline 17.0 (b), (c), (d), 12.0 general (d); CPA s. 12(2)(a) and (b).
      - Never write that a product is PPB, WHO or FDA approved. Never have doctors, pharmacists, nurses, celebrities or influencers endorse or recommend a product, and never write influencer scripts for medicines. Do not use customer stories of a medicine treating their condition.
      # Guideline 10.0 (b) and (c), 12.0 (window for the general public) (g); rule 38(1)(i) and (j); rule 24(2)(g) and guideline 5.0 (g) for factual price notices. Owner decision 2026-11-14: no discount or offer copy on any medicine, general sale ones included; offers on products that are not medicines stay allowed.
      - Never write discount or offer copy for any medicine, general sale medicines included (paracetamol, Panadol, ibuprofen, cough syrup, antacids, ORS, antimalarials, multivitamins and similar) and supplements. That covers percentage or shilling discounts, price cuts, "on offer", multi-buy deals, free samples, giveaways and competitions. A factual price list without claims is fine. Offers on products that are not medicines, such as lotions, cosmetics, toiletries (dawa ya meno), household products (dawa ya mbu, dawa ya wadudu), baby care and medical devices, and free services such as blood pressure checks are fine. When a customer asks for a discount on a medicine, you may say plainly that the pharmacy cannot give one.
      # Guideline 6.0 (k), (l), (m).
      - Never diagnose, never suggest that seeing a doctor or getting a prescription is unnecessary, and never frighten people about their condition or say it will get worse without a product. For symptoms, tell them to talk to the pharmacist or a doctor.
      # Act s. 36; rule 22(1), (5), (6), rule 34 (a), (b), (d); guideline 9.0 (a) to (f), 6.0 (n).
      - When a post promotes a specific general sale product, give its generic name next to the brand name, what it is approved for, its main warning, and the line "If symptoms persist, seek medical advice" or "Maumivu yakizidi pata ushauri wa daktari". Every product advert needs the Pharmacy and Poisons Board's written approval before it runs, so add the PPB advert approval reference the business gave you as "PPB approval ref. <reference>" and never invent one. MarketFlow keeps a medicine advert as a draft until the owner has entered that reference.
      # Rule 32 and 33; guideline 8.0.
      - Do not suggest medicines for pregnant or breastfeeding women apart from vitamin and mineral supplements, and then say to consult a health professional first. Never say a product is safe in pregnancy. Never aim health product ads at children under 12 or show a child with a product without an adult.
      - "Sell by: availability, genuine supply, the pharmacist's advice and opening hours, inside every rule above; urgency only from real opening hours, never fear about illness; next step: ask our pharmacist on WhatsApp."
      # Rule 30 and 31; guideline 7.0 (vitamins) and (weight management).
      - Never say vitamins replace a balanced diet or that health suffers without them. Weight loss or slimming claims must mention diet and exercise and carry the line "This product has not been proven to burn fat or block starch".
      - Tell customers to read the label and to talk to the pharmacist or a doctor about their condition.
    blocks:
      # Guideline 6.0 (m): no impression that a consultation is unnecessary.
      - pattern: '(?i)\bno\s+prescriptions?\s+(needed|required|necessary)\b|\bprescription[\s-]free\b|\bno\s+need\s+(to\s+see\s+(a|the|your)\s+doctor|for\s+(a\s+)?(doctor|prescription|consultation))\b|\bskip\s+the\s+doctor\b'
        reason: saying a prescription or a doctor is not needed
      # Guideline 16.0 (claims) (c) and (d); 7.0 (herbal) (o) and (p).
      - pattern: '(?i)\b(no|zero)\s+(known\s+)?(side[\s-]effects?|harmful\s+effects?|adverse\s+effects?|toxic\s+effects?)\b|\bfree\s+(of|from)\s+(any\s+)?side[\s-]effects?\b|\bwithout\s+(any\s+)?side[\s-]effects?\b|\b(100\s*%|completely|totally|perfectly|absolutely)\s+(safe|harmless)\b|\bsafe\s+for\s+(everyone|everybody|all\s+ages)\b|\bsafe\s+because\s+(it\s+is|it''s|they\s+are|they''re)\s+(natural|herbal|organic)\b|\bnatural\s+(and|&|so)\s+(completely\s+|100\s*%\s+)?safe\b'
        reason: claims of no side effects or complete safety
      # Guideline 10.0 (e): effects may not be presented as guaranteed.
      - pattern: '(?i)\b(100\s*%|guaranteed?)\s+(effective|results?|recovery|relief|cure|success)\b|\bresults\s+guaranteed\b|\bguaranteed\s+to\s+work\b|\bworks\s+(for\s+everyone|every\s+time)\b'
        reason: guaranteed results from medicine
      # Guideline 10.0 (e) and (f), 7.0 (herbal) (l), 16.0 (comparisons) (a).
      - pattern: '(?i)\bleast\s+toxic\b|\bbest[\s-]tolerated\b|\bmost\s+effective\s+(medicine|treatment|remedy|drug|painkiller|cure)\b|\b(best|strongest)\s+(painkillers?|remed(y|ies)|drugs?)\b|(\bnumber\s+one|\bno\.?\s*1|#1)\s+(treatment|remedy|drug|painkiller|medicine|brand)\b|\b(better|stronger)\s+than\s+(any|all|other)\s+(other\s+)?(medicines?|painkillers?|brands?|treatments?|drugs?|products?)\b'
        reason: superlative or unprovable comparison claims for medicine
      # Act s. 37 and Schedule paragraph 2 (prevention, relief or cure).
      - pattern: '(?i)\b(treats|heals|reverses|eliminates|ends|fights|beats|prevents|relieves|kills|gets\s+rid\s+of)\s+(your\s+|the\s+)?(diabetes|cancers?|tumou?rs?|tuberculosis|tb|epilepsy|seizures|lupus|leprosy|bilharzia|schistosomiasis|paralysis)\b'
        reason: claims about diseases the Pharmacy and Poisons Act bars from adverts
      # Act s. 37 and Schedule paragraphs 1 and 3 (cure), s. 39 and guideline 7.0 (herbal) (n) for other serious diseases.
      - pattern: '(?i)\b(treats|heals|reverses|eliminates|ends|beats|gets\s+rid\s+of)\s+(your\s+|the\s+)?(hiv|aids|hypertension|high\s+blood\s+pressure|heart\s+disease|syphilis|gonorrh?o?ea|kidney\s+stones|gallstones|pneumonia|goitre|hernia|blindness|deafness|infertility|erectile\s+dysfunction|impotence|premature\s+ejaculation|weak\s+erections?)\b'
        reason: treatment claims for serious diseases
      # Act s. 37 and Schedule paragraph 4 (restoration or stimulation of sexual functions); guideline 7.0 (medical devices) (g).
      - pattern: '(?i)\b(boosts?|restores?|increases?|enhances?|improves?|stimulates?|revives?)\s+(your\s+|male\s+|sexual\s+)?(libido|sex\s+drive|sexual\s+(performance|power|function|stamina)|erections?|manhood|man\s*power|virility)\b|\blast\s+longer\s+in\s+bed\b'
        reason: sexual performance claims
      # Act s. 38.
      - pattern: '(?i)\babortion\s+(pills?|tablets?|kits?|drugs?)\b|\bpregnancy\s+termination\s+(pills?|tablets?|kits?)\b|\b(terminates?|ends?|removes?)\s+(a|an|your|the)\s+(unwanted\s+)?pregnancy\b|\bbring\s+back\s+(your\s+)?(missed\s+)?periods?\b'
        reason: promoting anything for ending a pregnancy
      # Guideline 17.0 (d): no PPB, WHO or similar approval claims. "WHO" is matched in capitals only so "the pharmacist who approved" passes.
      - pattern: '\b((?i:ppb|fda|pharmacy\s+and\s+poisons\s+board)|WHO)[\s-]+(?i:approved|certified|endorsed)\b|(?i:\bapproved\s+by\s+(the\s+)?)(WHO\b|(?i:fda|world\s+health\s+organi[sz]ation)\b)'
        reason: claims that a product is PPB, WHO or FDA approved
      # Guideline 17.0 (c): no health workers or people posing as health workers promoting medicines.
      - pattern: '(?i)\b(doctors?|pharmacists?|nurses?|physicians?|dermatologists?|dentists?)-(recommended|approved|endorsed|trusted|tested)\b|\brecommended\s+by\s+(top\s+|leading\s+|many\s+|most\s+)?(doctors|pharmacists|nurses|physicians|dermatologists|dentists)\b|\b(\d+|nine|eight)\s+out\s+of\s+(10|ten)\s+(doctors|pharmacists|nurses|dentists)\b|\b(doctors|pharmacists|nurses|dermatologists|dentists)\s+(recommend|trust)\s+(this|our|it)\b'
        reason: endorsements by doctors, pharmacists or other health workers
      # Rule 26(1)(c) and (d), rule 38(1)(c), (g) and (i); guideline 7.0 (a) and (c), 12.0 general (a). Needs a promotion word in the same sentence, so a factual chat answer that names a stocked medicine passes. A refusal passes too (allow_negated): "We can't offer discounts on Ozempic".
      - pattern: '(?i)\b(?P<promo>\d+\s*%\s*off|discount(s|ed)?|special\s+offers?|on\s+offer|offers?\s+on|deals?\s+on|promo(tion)?s?|on\s+sale|(flash|mega|weekend|black\s+friday)\s+sale|cheap(er|est)?|buy\s+now|order\s+now|shop\s+now|grab\s+(yours|one|now)|get\s+yours|free\s+(delivery|shipping|samples?|gifts?|packs?|doses?)|giveaways?|bonanza|best\s+prices?|lowest\s+prices?|while\s+stocks?\s+last|limited\s+(time|offer|stock)|hurry)\b[^.!?\n]{0,40}?\b(antibiotics?|amoxicillin|amoxil|augmentin|azithromycin|ciprofloxacin|doxycycline|metronidazole|flagyl|ozempic|semaglutide|wegovy|rybelsus|mounjaro|zepbound|tirzepatide|saxenda|liraglutide|(weight[\s-]loss|slimming)\s+(injections?|jabs?|pens?)|tramadol|codeine|diazepam|valium|alprazolam|xanax|morphine|pethidine|sildenafil|viagra|tadalafil|cialis|misoprostol|cytotec|clomiphene|clomid)\b|\b(antibiotics?|amoxicillin|amoxil|augmentin|azithromycin|ciprofloxacin|doxycycline|metronidazole|flagyl|ozempic|semaglutide|wegovy|rybelsus|mounjaro|zepbound|tirzepatide|saxenda|liraglutide|(weight[\s-]loss|slimming)\s+(injections?|jabs?|pens?)|tramadol|codeine|diazepam|valium|alprazolam|xanax|morphine|pethidine|sildenafil|viagra|tadalafil|cialis|misoprostol|cytotec|clomiphene|clomid)\b[^.!?\n]{0,40}?\b(?P<promo>\d+\s*%\s*off|discount(s|ed)?|special\s+offers?|on\s+offer|on\s+sale|promo(tion)?s?|cheap(er|est)?|buy\s+now|order\s+now|shop\s+now|free\s+(delivery|shipping|samples?|gifts?|packs?|doses?)|giveaways?|best\s+prices?|lowest\s+prices?|while\s+stocks?\s+last|limited\s+(time|offer|stock)|hurry)\b'
        reason: promoting prescription-only or controlled medicines to the public
        allow_negated: true
      # Guideline 10.0 (b) and (c), 12.0 (window for the general public) (g); rule 38(1)(i) and (j). Owner decision 2026-11-14: no discount or offer copy on ANY medicine, general sale ones included. The medicine list is the prescription-only list above plus general sale medicines and dosage forms; lotions, cosmetics, devices ("BP machine", "glucometer") and services ("free blood pressure checks") are not in it, so offers on them pass. "vitamins" matches only in the plural or with a dosage form, so "20% off vitamin C serum" (a cosmetic) passes. A refusal passes (allow_negated).
      - pattern: '(?i)\b(?P<promo>\d+\s*%\s*(off|discount)|discount(s|ed)?|special\s+offers?|on\s+offer|offers?\s+on|deals?\s+on|promos?|promotions?|on\s+sale|(flash|mega|weekend|black\s+friday|clearance)\s+sale|half\s+price|price\s+(cuts?|drops?)|save\s+(kes|ksh|sh)\.?\s*\d+|cheap(er|est)?|buy\s+(one|1|two|2|three|3)\s+get\s+(one|1)|bogof|free\s+(samples?|gifts?|packs?|doses?)|giveaways?|bonanza|competition|best\s+prices?|lowest\s+prices?|punguzo|ofa|bei\s+(nafuu|poa|chini))\b[^.!?\n]{0,40}?\b(?P<med>medicines?|medications?|tablets|capsules|syrups?|painkillers?|pain\s+relief|supplements?|multi-?vitamins?|vitamins|vitamin(\s+[a-z0-9]{1,3})?\s+(tablets|capsules|supplements?|syrups?|gummies|drops)|drugs|inhalers?|paracetamol|panadol|calpol|ibuprofen|brufen|aspirin|diclofenac|antacids?|eno|gaviscon|cough\s+(syrups?|mixtures?|drops|medicines?)|lozenges|strepsils|ors|oral\s+rehydration(\s+salts?)?|anti-?malarials?|coartem|artemether|antihistamines?|piriton|cetirizine|loratadine|de-?wormers?|albendazole|mebendazole|eye\s+drops|ear\s+drops|dawa|antibiotics?|amoxicillin|amoxil|augmentin|azithromycin|ciprofloxacin|doxycycline|metronidazole|flagyl|ozempic|semaglutide|wegovy|rybelsus|mounjaro|zepbound|tirzepatide|saxenda|liraglutide|(weight[\s-]loss|slimming)\s+(injections?|jabs?|pens?)|tramadol|codeine|diazepam|valium|alprazolam|xanax|morphine|pethidine|sildenafil|viagra|tadalafil|cialis|misoprostol|cytotec|clomiphene|clomid)\b|\b(?P<med>medicines?|medications?|tablets|capsules|syrups?|painkillers?|pain\s+relief|supplements?|multi-?vitamins?|vitamins|vitamin(\s+[a-z0-9]{1,3})?\s+(tablets|capsules|supplements?|syrups?|gummies|drops)|drugs|inhalers?|paracetamol|panadol|calpol|ibuprofen|brufen|aspirin|diclofenac|antacids?|eno|gaviscon|cough\s+(syrups?|mixtures?|drops|medicines?)|lozenges|strepsils|ors|oral\s+rehydration(\s+salts?)?|anti-?malarials?|coartem|artemether|antihistamines?|piriton|cetirizine|loratadine|de-?wormers?|albendazole|mebendazole|eye\s+drops|ear\s+drops|dawa|antibiotics?|amoxicillin|amoxil|augmentin|azithromycin|ciprofloxacin|doxycycline|metronidazole|flagyl|ozempic|semaglutide|wegovy|rybelsus|mounjaro|zepbound|tirzepatide|saxenda|liraglutide|(weight[\s-]loss|slimming)\s+(injections?|jabs?|pens?)|tramadol|codeine|diazepam|valium|alprazolam|xanax|morphine|pethidine|sildenafil|viagra|tadalafil|cialis|misoprostol|cytotec|clomiphene|clomid)\b[^.!?\n]{0,40}?\b(?P<promo>\d+\s*%\s*(off|discount)|discount(s|ed)?|special\s+offers?|on\s+offer|promos?|promotions?|on\s+sale|(flash|mega|weekend|black\s+friday|clearance)\s+sale|half\s+price|price\s+(cuts?|drops?)|save\s+(kes|ksh|sh)\.?\s*\d+|cheap(er|est)?|buy\s+(one|1|two|2|three|3)\s+get\s+(one|1)|bogof|free\s+(samples?|gifts?|packs?|doses?)|giveaways?|bonanza|competition|best\s+prices?|lowest\s+prices?|punguzo|ofa|bei\s+(nafuu|poa|chini))\b'
